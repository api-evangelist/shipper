name: Shipper
description: >-
  Shipper is an Indonesian technology-driven logistics aggregator that connects
  merchants and e-commerce sellers to hundreds of third-party courier and
  last-mile delivery partners through a single platform. Its services span a
  logistics aggregator (multi-courier rate check, order creation, pickup and
  tracking), nationwide fulfillment and warehousing, contract logistics,
  international freight forwarding, and e-commerce enablement. Developers
  integrate via the HTTP-based Shipper Logistics API (v3), which exposes
  location search, domestic pricing, order creation (including COD), shipping
  label and receipt generation, pickup request, and shipment status tracking,
  with real-time delivery-status webhooks. Backed by Lightspeed Venture
  Partners, Partech, and Prosus Ventures.
