apis:
- name: Shipper Logistics API
  description: >-
    HTTP-based API (v3) for interacting with Shipper's location, pricing, and
    shipment features — search location by keyword and administrative area,
    retrieve domestic multi-courier pricing, create orders (including COD),
    generate shipping labels and receipts, request pickups, retrieve order
    details, and track shipment status. Authenticated with an API key passed in
    the X-API-Key header. Sandbox and production environments are available.
  humanURL: https://logistics-docs.shipper.id/
  baseURL: https://merchant-api.shipper.id
